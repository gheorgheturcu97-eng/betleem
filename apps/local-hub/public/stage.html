<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/fonts/inter.css">
<link rel="stylesheet" href="/fonts/display/display.css">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reverb – Scenă</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0d;color:#f2f2f2;font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden;cursor:none}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:2vw;padding:1.2vh 3vw;font-size:var(--hs,3.2vh);color:#9aa0a6;border-bottom:1px solid #222;flex:none}
  header:empty,header.empty{display:none}
  #head{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #head b{color:#fff}
  #pos{font-size:.8em}
  #clock,#timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.25em}
  #clock{color:#fff}
  #timer{padding:.1em .5em;border-radius:.4em;color:#e9ecef;background:#1b1d22;transition:background .4s,color .4s}
  #timer.t1{background:#f5d90a;color:#111} #timer.t2{background:#ff8c1a;color:#111}
  #timer.t3,#svc.t3{background:#e5243b;color:#fff;animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,36,59,.75);opacity:1}50%{box-shadow:0 0 0 .5em rgba(229,36,59,0);opacity:.7}}
  #svc{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.25em;padding:.1em .5em;border-radius:.4em;color:#e9ecef;background:#1b1d22;transition:background .4s,color .4s;white-space:nowrap}
  #svc small{font-size:.55em;font-weight:600;opacity:.75;margin-right:.4em;text-transform:uppercase;letter-spacing:.06em}
  #svc.idle{color:#9aa0a6;background:transparent;border:1px solid #2a2d33}
  #svc.t1{background:#f5d90a;color:#111} #svc.t2{background:#ff8c1a;color:#111}
  #msg{background:#f5b301;color:#000;padding:1vh 3vw;font-size:3vh;display:none;flex:none}
  main{flex:1;min-height:0;display:flex;flex-direction:column}
  #now{flex:1;min-height:0;padding:3vh 3vw;font-size:5.4vh;line-height:1.15;overflow:hidden}
  #now img,#now video{width:100%;height:100%;object-fit:contain;display:block}
  /* like ProPresenter: the next slide right under the lyrics, as wide as them; the program ahead on one long row below */
  #next{flex:0 1 auto;min-height:0;max-height:var(--ns,40vh);padding:1.4vh 3vw 1.6vh;font-size:3.4vh;color:#8a8f95;line-height:1.15;
        overflow:hidden;box-sizing:border-box;border-top:.35vh solid #2a2d33}
  #next .label{font-size:2.2vh;margin-bottom:.6vh}
  #next img{height:14vh;border-radius:.6vh}
  #prog{flex:none;display:flex;align-items:center;gap:2.4vw;padding:1.1vh 3vw;border-top:1px solid #222;background:#111215;
        font-size:2.6vh;color:#c9ced6;white-space:nowrap;overflow:hidden}
  #prog:empty,#next:empty{display:none}
  #prog .up{flex:none;font-size:.8em;color:#8a8f95;text-transform:uppercase;letter-spacing:.08em}
  #prog .it{display:flex;gap:.8vw;align-items:baseline;min-width:0;flex:0 1 auto}
  #prog .it b{min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  #prog .it small{color:#8a8f95;font-size:.8em;flex:none}
  #prog .it:first-of-type b{color:#fff}
  #prog .it+.it::before{content:"›";color:#555;margin-right:1.6vw}
  .label{font-size:2.6vh;color:var(--lc,#f5b301);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1vh}
  .label .up{color:#8a8f95;margin-right:1.2vw}
  body.nolabels #now .label{display:none}
  .line{display:flex;flex-wrap:wrap;margin-bottom:1.2vh}
  #now.center .line,#next.center .line{justify-content:center} #now.center,#next.center{text-align:center}
  #now.right .line,#next.right .line{justify-content:flex-end} #now.right,#next.right{text-align:right}
  .seg{display:inline-flex;flex-direction:column;white-space:pre}
  .seg b{color:var(--chord,#f5b301);font-size:.7em;min-height:1em;font-weight:700}
  .seg i{font-style:normal}
  .ly{white-space:pre}
  .second{margin-top:1.5vh;padding-top:1.2vh;border-top:1px solid #333;font-size:.75em;color:#aab0b8}
  .verse{line-height:1.25}
  #blank{position:fixed;top:1vh;left:50%;transform:translateX(-50%);background:#b00020;color:#fff;padding:.5vh 1vw;font-size:2.4vh;display:none;border-radius:4px}
</style>
</head>
<body>
<header><span id="head"></span><span id="pos"></span><span id="svc" title="Timpul slujbei: minutele din program, pornește la prima cântare"></span><span id="timer" title="Timpul rămas pentru ce e acum în program"></span><span id="clock"></span></header>
<div id="msg"></div>
<main><div id="now"></div><div id="next"></div></main>
<footer id="prog"></footer>
<div id="blank">ECRAN NEGRU</div>
<script type="module">
  import { connect, esc, stayAwake, outputEvents } from '/client.js';
  import { chordLineToHtml, sectionColor } from '/core/song.js';
  const $ = id => document.getElementById(id);
  stayAwake();
  document.ondblclick = () => document.documentElement.requestFullscreen?.();
  let S = null, D = {}, skew = 0;
  const KIND = { sermon: 'Predică', prayer: 'Rugăciune', announcement: 'Anunțuri', reading: 'Citire', other: '', media: 'Prezentare' };
  const mmss = s => { s = Math.abs(Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const isVideo = src => /\.(mp4|webm|mov)$/i.test(src);
  // the timer counts down the minutes planned for this item: yellow at the last quarter, orange at the last tenth, red when over
  function tick() {
    if (D.clock !== false) $('clock').textContent = new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
    const t = $('timer'), it = S?.setlist[S.live.item], c = S?.live.countdown;
    if (c && c.screens !== 'main' && c.to > Date.now() + skew) {                // "Începem în" also for the band
      const left = Math.ceil((c.to - Date.now() - skew) / 1000);
      t.style.display = ''; t.className = left <= 60 ? 't1' : ''; t.textContent = '⏱ ' + mmss(left); return;
    }
    if (D.timer === false || !it || !S.live.since) { t.textContent = ''; t.style.display = 'none'; t.className = ''; return; }
    t.style.display = '';
    const used = (Date.now() + skew - S.live.since) / 1000, plan = (Number(it.minutes) || 0) * 60;
    if (!plan) { t.textContent = mmss(used); t.className = ''; return; }
    const left = plan - used;
    t.textContent = left >= 0 ? mmss(left) : '+' + mmss(left);
    t.className = left < 0 ? 't3' : left <= plan * 0.1 ? 't2' : left <= plan * 0.25 ? 't1' : '';
  }
  // the whole service: the minutes planned for the program, counting down from the first item on Live
  // yellow with 5 minutes left, orange with 3, red and pulsing when over
  function svcTick() {
    const el = $('svc');
    if (!S || D.service === false || !S.setlist.length) { el.style.display = 'none'; return; }
    const total = (Number(S.service?.timerMinutes) || S.setlist.reduce((a, x) => a + (Number(x.minutes) || 0), 0)) * 60;
    if (!total) { el.style.display = 'none'; return; }
    el.style.display = '';
    if (!S.live.serviceStart) { el.className = 'idle'; el.innerHTML = '<small>Slujba</small>' + hms(total); return; }
    const left = total - (Date.now() + skew - S.live.serviceStart) / 1000;
    el.className = left < 0 ? 't3' : left <= 180 ? 't2' : left <= 300 ? 't1' : '';
    el.innerHTML = '<small>Slujba</small>' + (left < 0 ? '+' : '') + hms(left);
  }
  const hms = s => { s = Math.abs(Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0'); };
  setInterval(() => { tick(); svcTick(); }, 500);
  const render = sl => !sl ? '' : sl.image
    ? (isVideo(sl.image) ? `<video src="${esc(sl.image)}" muted autoplay loop playsinline></video>` : `<img src="${esc(sl.image)}" alt="">`)
    : (sl.label ? `<div class="label" style="--lc:${sectionColor(sl.label)}">${esc(sl.label)}${sl.bible ? ' · ' + esc(sl.bible) : ''}</div>` : '') +
      (sl.bible ? `<div class="verse">${sl.lines.map(esc).join('<br>')}</div>` : sl.lines.map(l => `<div class="line">${chordLineToHtml(l, esc)}</div>`).join('')) +
      (sl.second ? `<div class="second">${sl.second.lines.map(esc).join('<br>')}</div>` : '');
  function style(d) {
    D = d || {};
    for (const el of [$('now'), $('next')]) { el.classList.toggle('center', D.align === 'center'); el.classList.toggle('right', D.align === 'right'); }
    document.body.style.fontFamily = `"${D.font}", "Segoe UI", Arial, sans-serif`;
    $('now').style.fontSize = D.size + 'vh'; $('now').style.color = D.color;
    document.documentElement.style.setProperty('--chord', D.chordColor);
    document.documentElement.style.setProperty('--hs', (D.headSize || 3.2) + 'vh');
    const n = $('next').style;                       // the "Urmează" part: its own size, color and share of the screen
    n.fontSize = (D.nextSize || 3.4) + 'vh'; n.color = D.nextColor || '#8a8f95';
    document.documentElement.style.setProperty('--ns', Math.min(55, Math.max(20, D.nextShare || 35)) + 'vh');   // how much of the screen the next slide may take
    n.fontFamily = document.body.style.fontFamily;
    document.body.classList.toggle('nolabels', D.labels === false);
    $('clock').style.display = D.clock === false ? 'none' : '';
    $('head').style.visibility = D.title === false ? 'hidden' : '';
  }
  // long verses get smaller letters instead of being cut off
  function fit(el, size) {
    el.style.fontSize = size + 'vh';
    for (let v = size; v > 1.6 && el.scrollHeight > el.clientHeight + 2; v -= 0.2) el.style.fontSize = v.toFixed(1) + 'vh';
  }
  const outHub = connect(s => {
    S = s; if (s.now) skew = s.now - Date.now();
    style(s.display?.stage);
    const L = s.live, item = s.setlist[L.item];
    $('head').innerHTML = L.item === -2 ? `<b>${esc(L.title || 'Biblia')}</b>` : item ? `<b>${esc(item.title || KIND[item.kind] || '')}</b>${item.key ? ' · ton ' + esc(item.key) : ''}${item.leader ? ' · ' + esc(item.leader) : ''}` : '';
    $('pos').textContent = L.slides.length > 1 ? `${L.slide + 1} / ${L.slides.length}` : '';
    $('now').innerHTML = render(L.slides[L.slide]);
    // what comes next: the next slide of this item; if it is the last one, the next item
    const n = L.slides[L.slide + 1], nextItem = s.setlist[L.item + 1];
    $('next').innerHTML = D.next === false ? '' : n
      ? (n.image ? `<div class="label"><span class="up">Urmează</span></div>${isVideo(n.image) ? '▶ video' : `<img src="${esc(n.image)}" alt="">`}`
        : `<div class="label" style="--lc:${sectionColor(n.label || '')}"><span class="up">Urmează</span>${esc(n.label || '')}</div>${n.bible ? `<div class="verse">${n.lines.map(esc).join('<br>')}</div>` : n.lines.map(l => `<div class="line">${chordLineToHtml(l, esc)}</div>`).join('')}`)
      : nextItem ? `<div class="label"><span class="up">Urmează</span></div>${esc(nextItem.title || KIND[nextItem.kind] || '')}` : '';
    // the program ahead, for the band: title, key, minutes
    const ahead = s.setlist.slice(L.item + 1, L.item + 1 + (D.upNext ?? 2));
    $('prog').innerHTML = ahead.length ? `<span class="up">În program</span>` + ahead.map(x =>
      `<div class="it"><b>${esc(x.title || KIND[x.kind] || '')}</b><small>${[x.key ? 'ton ' + x.key : '', x.minutes ? x.minutes + ' min' : ''].filter(Boolean).map(esc).join(' · ')}</small></div>`).join('') : '';
    // the next slide is big enough to read from the stage (at least ¾ of the lyrics), then the lyrics fill what is left
    $('next').style.fontSize = '2vh'; fit($('now'), D.size || 5.4);                       // the lyrics first, they stay the biggest
    const nowV = parseFloat($('now').style.fontSize) || D.size || 5.4;
    fit($('next'), Math.min(Math.max(D.nextSize || 3.4, nowV * 0.7), nowV * 0.8)); fit($('now'), nowV); svcTick();
    $('blank').style.display = L.blank ? 'block' : 'none';
    $('msg').style.display = L.message && L.messageTo !== 'main' ? 'block' : 'none'; $('msg').textContent = L.message;
    tick();
  }, outputEvents('stage', () => outHub));
</script>
</body>
</html>
