<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<link rel="manifest" href="/manifest-live.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reverb">

<link rel="stylesheet" href="/fonts/inter.css">
<link rel="stylesheet" href="/fonts/display/display.css">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Reverb</title>
<style>
  :root{--bg:#111214;--card:#1b1d21;--line:#2a2d33;--fg:#f1f1f1;--mute:#8d939b;--acc:#f5b301}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Inter,-apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
  header{position:sticky;top:0;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}
  header h1{font-size:17px;margin:0}
  #dot{width:9px;height:9px;border-radius:50%;background:#c33;display:inline-block;margin-right:6px}
  #dot.on{background:#2ecc71}
  nav{display:flex;gap:6px;padding:10px 16px}
  nav button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
  nav button.sel{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
  .order{list-style:none;margin:0;padding:0 16px}
  .order li{display:flex;gap:12px;padding:12px;border-radius:10px;margin-bottom:6px;background:var(--card)}
  .order li.now{outline:2px solid var(--acc)}
  .order time{color:var(--mute);font-variant-numeric:tabular-nums;min-width:44px}
  .order small{color:var(--mute);display:block}
  #lyrics{padding:8px 16px;font-size:calc(22px * var(--fz,1));line-height:1.35}
  #lyrics.fit-whole{padding:4px 12px} #lyrics.fit-whole .label{font-size:.55em;margin:.5em 0 .1em;break-after:avoid} #lyrics.fit-whole .slide{opacity:1;padding:0 0 .35em;margin:0;border-radius:0}
  .songhead{display:flex;align-items:center;gap:10px;padding:6px 16px 0}
  .songhead b{font-size:19px;flex:1;min-width:0} .songhead .key{padding:3px 10px;border-radius:999px;background:var(--acc);color:#000;font-weight:700;font-size:14px}
  .songhead .back{border:0;border-radius:999px;padding:6px 12px;background:var(--card);color:var(--fg);font:600 13px system-ui}
  .tools{display:flex;gap:6px;align-items:center;padding:4px 16px 0;color:var(--mute);font-size:13px}
  .tools button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;min-width:42px;height:30px;font:600 14px system-ui;white-space:nowrap}
  .tools label{display:flex;gap:6px;align-items:center;margin-left:auto} .tools[hidden],.songhead[hidden],.nextsong[hidden]{display:none}
  .nextsong{margin:14px 16px;padding:12px;border-radius:10px;background:var(--card);color:var(--mute);font-size:14px} .nextsong b{color:var(--fg)}
  .order li{cursor:pointer} .order li.song::after{content:"›";margin-left:auto;color:var(--mute);font-size:22px}
  .label{color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:14px 0 4px}
  .slide{padding:10px 12px;border-radius:10px;margin-bottom:4px;opacity:.45}
  .slide.now{opacity:1;background:var(--card)}
  .line{display:flex;flex-wrap:wrap}
  .seg{display:inline-flex;flex-direction:column;white-space:pre}
  .seg b{color:var(--acc);font-size:.65em;height:1.5em;line-height:1.5em}   /* the same height with or without a chord: the words stay on one line */
  .seg i{line-height:1.35}
  .seg i{font-style:normal}
  .ly{white-space:pre-wrap}
  #pad{position:fixed;left:0;right:0;bottom:0;display:none;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
  #pad button{flex:1;padding:16px;border:0;border-radius:12px;font:600 17px system-ui;background:var(--card);color:var(--fg)}
  #pad .go{background:var(--acc);color:#000}
  .login{padding:16px;color:var(--mute);font-size:14px}
  .login input{width:110px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
  .login button{padding:8px 12px;border-radius:8px;border:0;background:var(--acc)}
  /* 🎤 Predicator: big, simple, nothing else on the page */
  body.pred nav,body.pred #tools,body.pred #lyrics,body.pred #order,body.pred #songhead,body.pred #nextsong,body.pred #pad{display:none!important}
  #pred{display:none;flex-direction:column;gap:12px;padding:12px 16px calc(120px + env(safe-area-inset-bottom))} body.pred #pred{display:flex}
  .pv{border-radius:14px;background:#000;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;position:relative;border:1px solid var(--line)}
  .pv img{width:100%;height:100%;object-fit:contain} .pv .tx{padding:4%;text-align:center;font-size:clamp(14px,4vw,26px);line-height:1.3;white-space:pre-line}
  .pv .tag{position:absolute;left:8px;top:8px;font:700 11px system-ui;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.6)}
  .pv.now{border:2px solid var(--acc)} .pv.nx{width:55%;opacity:.8} .prow{display:flex;gap:12px;align-items:flex-start}
  .pinfo{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  #pTime{font:700 38px/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums} #pTime.over{color:#ff5a5a} #pTime small{display:block;font:500 12px system-ui;color:var(--mute);margin-top:4px}
  #pCount{color:var(--mute);font-size:14px} #pState{padding:10px 12px;border-radius:10px;background:var(--card);font-size:15px} #pState.off{background:#5a1d1d}
  #pNotes{white-space:pre-wrap;background:var(--card);border-radius:10px;padding:12px;font-size:17px;line-height:1.45} #pNotes:empty{display:none}
  #pBtns{position:fixed;left:0;right:0;bottom:0;display:none;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)} body.pred #pBtns{display:flex}
  #pBtns button{flex:1;height:84px;border:0;border-radius:18px;font:700 26px system-ui;background:var(--card);color:var(--fg)} #pBtns .go{flex:2;background:var(--acc);color:#000}
  #pBtns button:disabled{opacity:.35}
  /* ▦ the office QR: the next program, read only */
  body.nextv nav,body.nextv #tools,body.nextv #lyrics,body.nextv #order,body.nextv #songhead,body.nextv #nextsong,body.nextv #pad,body.nextv #login{display:none!important}
  #nextv{display:none;padding:12px 16px 30px} body.nextv #nextv{display:block}
  #nextv h2{margin:6px 0 2px;font-size:22px} #nextv .when{color:var(--mute);margin-bottom:12px} #nextv .draft{color:var(--acc);font-size:13px}
</style>
</head>
<body>
<header><h1><span id="dot"></span><span id="title">Reverb</span></h1><span id="now" style="color:var(--mute);font-size:14px;flex:1;text-align:right"></span><a id="whoBack" href="/m.html?alege=1" hidden title="Schimbă ce faci (muzician, versuri, predicator, echipa media)" style="margin-left:12px;font-size:20px;text-decoration:none;color:var(--mute)">⇄</a></header>
<nav>
  <button data-v="plan">Planificare</button>
  <button data-v="chords">Acorduri</button>
  <button data-v="order">Program</button>
</nav>
<div class="songhead" id="songhead" hidden></div>
<div class="tools" id="tools"><button id="fzDown" title="Litere mai mici">A−</button><button id="fzUp" title="Litere mai mari">A＋</button>
  <label><input type="checkbox" id="follow" checked> Urmează ecranul</label></div>
<div id="lyrics"></div>
<div class="nextsong" id="nextsong" hidden></div>
<ul class="order" id="order" hidden></ul>
<div id="pred">
  <div id="pState"></div>
  <div class="pv now" id="pNow"></div>
  <div class="prow"><div class="pv nx" id="pNext"></div><div class="pinfo"><div id="pTime"></div><div id="pCount"></div></div></div>
  <div id="pNotes"></div>
</div>
<div id="nextv"></div>
<div id="pBtns"><button id="pPrev" title="Slide-ul anterior">◀</button><button class="go" id="pGo">Înainte ▶</button></div>
<div class="login" id="login">Faci parte din echipa media? <input id="pin" type="password" inputmode="numeric" placeholder="PIN"> <button id="ok">Intră</button></div>
<div id="pad"><button id="prev">◀ Înapoi</button><button id="blank">Negru</button><button class="go" id="next">Înainte ▶</button></div>
<script type="module">
  import { connect, esc, stayAwake } from '/client.js';
  import { fitWhole, unfit } from '/fit.js';
  import { stripChords, chordLineToHtml, sectionColor, originalKey, keyDistance, toSlides, arrange, parseSong, transpose, prefersFlats } from '/core/song.js';
  const $ = id => document.getElementById(id);
  try { if (localStorage.getItem('m.who')) $('whoBack').hidden = false; } catch {}
  // musicians open this with ?v=chords (from the QR code in Live): chords, the program, and any song of it
  let view = new URLSearchParams(location.search).get('v') || 'lyrics', S = null, browse = -1, browseSlides = null;
  if (!['lyrics', 'chords', 'order', 'pred', 'next'].includes(view)) view = 'lyrics';
  if (view === 'next') { document.body.classList.add('nextv'); setTimeout(() => renderNext(), 0); }   // from home (no live connection) it still shows
  if (view === 'pred') {                             // 🎤 the preacher's QR carries its PIN after # (never sent to the network as part of the address)
    document.body.classList.add('pred');
    const hp = new URLSearchParams(location.hash.slice(1)).get('p');
    if (hp) { try { localStorage.setItem('bnc-pin', hp); } catch {} history.replaceState(null, '', location.pathname + location.search); }
  }
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('sel', x.dataset.v === view));
  let fz = (() => { try { return +localStorage.getItem('betleem.fz') || 1; } catch { return 1; } })();
  const setFz = v => { fz = Math.min(2.2, Math.max(0.6, v)); document.documentElement.style.setProperty('--fz', fz); try { localStorage.setItem('betleem.fz', fz); } catch {} };
  setFz(fz);
  $('fzUp').onclick = () => setFz(fz + 0.1); $('fzDown').onclick = () => setFz(fz - 0.1);
  $('follow').onchange = () => { if ($('follow').checked) { browse = -1; browseSlides = null; } render(); };
  const songCache = new Map();
  async function slidesOf(i) {                       // a song of the program, in its key and order, the same slides as on the screen
    const it = S.setlist[i]; if (!it) return [];
    if (it.kind !== 'song') return (it.slides || []).map(src => ({ label: '', lines: [], image: src }));
    let song = songCache.get(it.songId);
    if (!song || song.updatedAt !== it.rev) { song = await fetch('/api/songs/' + it.songId).then(r => r.json()); songCache.set(it.songId, song); }
    const orig = originalKey(song.key, song.body), steps = it.key && orig ? keyDistance(orig, it.key) : 0;
    return toSlides(arrange(parseSong(transpose(song.body, steps, prefersFlats(it.key || orig || 'C'))), it.arrangement || song.arrangement), it.maxLines || 4);
  }
  async function openItem(i) {
    if (i === S.live.item) { browse = -1; browseSlides = null; $('follow').checked = true; }
    else { browse = i; browseSlides = await slidesOf(i); $('follow').checked = false; }
    view = 'chords'; document.querySelectorAll('nav button').forEach(x => x.classList.toggle('sel', x.dataset.v === view));
    render(); scrollTo({ top: 0 });
  }
  stayAwake();
  const hub = connect(s => { S = s; S._at = Date.now(); if ($('follow').checked) { browse = -1; browseSlides = null; } render(); }, e => {
    if (e.type === 'online' || e.type === 'offline') $('dot').classList.toggle('on', e.type === 'online');
    if (e.role) { const ctl = e.role !== 'viewer' && e.role !== 'preacher'; $('pad').style.display = ctl ? 'flex' : 'none'; $('login').hidden = ctl || (view === 'pred' && e.role === 'preacher'); if (view === 'pred' && S) renderPred(); }
    if (e.type === 'login' && !e.ok) alertBox('PIN greșit');
    if (e.type === 'error') alertBox(e.error);
  });
  addEventListener('resize', () => { if ($('lyrics').classList.contains('fit-whole')) fitWhole($('lyrics'), { below: $('pad') }); });
  function alertBox(t) { $('now').textContent = t; setTimeout(render, 2500); }
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
    if (b.dataset.v === 'plan') { location.href = '/planning.html'; return; }   // the lyrics are in Acorduri too: this place is for the plan
    view = b.dataset.v; document.querySelectorAll('nav button').forEach(x => x.classList.toggle('sel', x === b)); render();
  });
  $('ok').onclick = () => hub.login($('pin').value);
  $('next').onclick = () => hub.send({ type: 'next' });
  $('prev').onclick = () => hub.send({ type: 'prev' });
  $('blank').onclick = () => hub.send({ type: 'blank' });
  $('pGo').onclick = () => hub.send({ type: S && S.live.item === S.live.sermon ? 'next' : 'start' });
  $('pPrev').onclick = () => hub.send({ type: 'prev' });
  addEventListener('keydown', e => { if (view !== 'pred') return;   // a clicker / keyboard on the preacher's laptop works too
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); $('pGo').click(); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); $('pPrev').click(); } });
  setInterval(() => { if (view === 'pred' && S) renderPred(); }, 1000);
  function renderPred() {
    const L = S.live, si = L.sermon, it = S.setlist[si], on = si >= 0 && L.item === si, ctl = hub.role === 'preacher' || hub.role === 'operator' || hub.role === 'leader';
    $('login').hidden = ctl;
    $('pState').className = L.preacherOff ? 'off' : '';
    $('pState').textContent = !ctl ? 'Introdu PIN-ul de predicator. Îl vezi pe calculatorul bisericii: Live → 📱 Pe telefon, la 🎤 Predicator.'
      : si < 0 ? 'Ai intrat ✔. Nu există încă o predică în programul de azi: regia o adaugă în program (➕ Predică), apoi apeși ▶ aici.'
      : L.preacherOff ? 'Regia a preluat controlul slide-urilor. Așteaptă sau roagă regia să ți-l dea înapoi.'
      : on ? `🎤 Ai controlul: ${it.title || 'Predica'}` : `Predica „${it.title || 'Predica'}” nu e încă pe ecran. Apasă ▶ ca s-o pornești.`;
    const sl = it?.slides || [], cur = on ? L.slide : -1;
    const show = (el, src, tag) => { el.innerHTML = (tag ? `<span class="tag">${tag}</span>` : '') + (src ? (/\.(mp4|webm|mov)$/i.test(src) ? '<div class="tx">▶ video</div>' : `<img src="${esc(src)}" alt="">`) : `<div class="tx">${tag === 'ACUM' && on && !sl.length ? esc((L.slides[L.slide]?.lines || []).map(stripChords).join('\n')) || '—' : '—'}</div>`); };
    show($('pNow'), on ? sl[cur] : sl[0], on ? 'ACUM' : 'PRIMUL'); show($('pNext'), on ? sl[cur + 1] : sl[1], 'URMEAZĂ');
    $('pCount').textContent = sl.length ? `Slide ${on ? cur + 1 : 0} din ${sl.length}` : 'Predica nu are slide-uri atașate.';
    $('pNotes').textContent = it?.planNotes || '';
    const mins = it?.minutes || 0, drift = S.now ? S.now - (S._at || Date.now()) : 0;
    if (on && mins && L.since) {
      const left = Math.round(mins * 60 - (Date.now() + drift - L.since) / 1000), a = Math.abs(left);
      $('pTime').className = left < 0 ? 'over' : ''; $('pTime').innerHTML = `${left < 0 ? '+' : ''}${Math.floor(a / 60)}:${String(a % 60).padStart(2, '0')}<small>${left < 0 ? 'peste timp' : 'rămase din ' + mins + ' min'}</small>`;
    } else $('pTime').innerHTML = mins ? `${mins}:00<small>timpul predicii</small>` : '';
    $('pGo').textContent = on ? 'Înainte ▶' : '▶ Pornește'; $('pGo').disabled = $('pPrev').disabled = !ctl || si < 0 || !!L.preacherOff;
    $('pPrev').disabled ||= !on || cur <= 0;
  }

  function times(s) {
    let t = s.service.startsAt ? new Date(s.service.startsAt).getTime() : null;
    return s.setlist.map(it => { const at = t; if (t) t += (it.minutes || 0) * 60000; return at; });
  }
  let nextT;
  async function renderNext() {                       // the next program of the church, as the pastor sees it from the office QR
    const r = await fetch('/api/next').then(x => x.json()).catch(() => null), s = r?.service;
    $('title').textContent = r?.church || 'Reverb'; $('now').textContent = '';
    if (!s) { $('nextv').innerHTML = '<p style="color:var(--mute)">Niciun program planificat încă.</p>'; return; }
    const d = new Date(s.date); let t = d.getTime();
    $('nextv').innerHTML = `<h2>${esc(s.title)}</h2><div class="when">${esc(d.toLocaleDateString('ro-RO', { weekday: 'long', day: 'numeric', month: 'long' }))} · ${d.toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' })}${s.draft ? ' · <span class="draft">ciornă, se mai poate schimba</span>' : ''}</div>
      <ul class="order" style="padding:0">${s.items.map(it => { const at = new Date(t); t += it.minutes * 60000;
        return `<li style="cursor:default"><time>${at.toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' })}</time><div>${esc(it.title || it.kind)}<small>${esc([it.key && 'ton ' + it.key, it.leader, it.minutes && it.minutes + ' min'].filter(Boolean).join(' · '))}</small></div></li>`; }).join('')}</ul>`;
  }
  function render() {
    if (!S) return;
    if (view === 'pred') return renderPred();
    if (view === 'next') { clearTimeout(nextT); nextT = setTimeout(renderNext, 400); return; }   // the program changed somewhere: read it again
    const L = S.live, item = S.setlist[L.item];
    $('title').textContent = S.service.title || 'Reverb';
    $('now').textContent = item ? item.title : '';
    $('lyrics').hidden = $('tools').hidden = view === 'order'; $('order').hidden = view !== 'order';
    $('songhead').hidden = $('nextsong').hidden = true;
    if (view === 'order') {
      const ts = times(S);
      $('order').innerHTML = S.setlist.map((it, i) => `<li class="${i === L.item ? 'now' : ''} ${it.kind === 'song' || it.slides?.length ? 'song' : ''}" data-i="${i}">
        <time>${ts[i] ? new Date(ts[i]).toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' }) : ''}</time>
        <div>${esc(it.title || it.kind)}<small>${esc([(it.key || it.origKey) && 'ton ' + (it.key || it.origKey), it.leader, it.minutes && it.minutes + ' min'].filter(Boolean).join(' · '))}</small></div></li>`).join('');
      document.querySelectorAll('.order li.song').forEach(li => li.onclick = () => openItem(+li.dataset.i));
      return;
    }
    const chords = view === 'chords';
    const shown = browse >= 0 && S.setlist[browse] ? browse : L.item, it = S.setlist[shown];
    if (it) {
      $('songhead').hidden = false;
      $('songhead').innerHTML = `<b>${esc(it.title || '')}</b>${it.key || it.origKey ? `<span class="key">${esc(it.key || it.origKey)}</span>` : ''}${browse >= 0 ? '<button class="back" id="back">↩ Ce e pe ecran</button>' : ''}`;
      if ($('back')) $('back').onclick = () => { $('follow').checked = true; browse = -1; browseSlides = null; render(); };
      const nx = S.setlist.slice(shown + 1).find(x => x.kind === 'song');
      if (nx) { $('nextsong').hidden = false; $('nextsong').innerHTML = `Urmează: <b>${esc(nx.title)}</b>${nx.key || nx.origKey ? ' · ton ' + esc(nx.key || nx.origKey) : ''}`; }
    }
    const slides = browse >= 0 && browseSlides ? browseSlides : L.slides, cur = browse >= 0 ? -1 : L.slide;
    let last = null;
    $('lyrics').innerHTML = slides.map((sl, i) => {
      const head = sl.label && sl.label !== last ? `<div class="label" style="color:${sectionColor(sl.label)}">${esc(sl.label)}</div>` : ''; last = sl.label;
      const body = sl.image ? (/\.(mp4|webm|mov)$/i.test(sl.image) ? '▶ video' : `<img src="${esc(sl.image)}" alt="" style="width:100%;border-radius:8px">`) : sl.lines.map(l => chords ? `<div class="line">${chordLineToHtml(l, esc)}</div>` : `<div>${esc(stripChords(l))}</div>`).join('');
      return `${head}<div class="slide ${i === cur || cur < 0 ? 'now' : ''}" data-i="${i}" data-fit-keep>${body}</div>`;
    }).join('') || `<p style="color:var(--mute)">Nimic pe ecran acum. Deschide <b>Program</b> și alege o cântare.</p>`;
    // not following the screen: the whole song fitted on the phone (no scrolling while you sing or play)
    const whole = !$('follow').checked && !!it && slides.length > 0;
    if (whole) requestAnimationFrame(() => fitWhole($('lyrics'), { below: $('pad') })); else unfit($('lyrics'));
    if (cur >= 0 && !whole) document.querySelector('.slide.now')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    if (hub.role !== 'viewer' && hub.role !== 'preacher') document.querySelectorAll('.slide').forEach(el => el.onclick = () => hub.send({ type: 'go', item: browse >= 0 ? browse : L.item, slide: +el.dataset.i }));
  }
</script>
</body>
</html>
