<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control — Bethlehem</title>
<style>
  :root{--bg:#121316;--panel:#1a1c20;--card:#22252a;--line:#2e3138;--fg:#eceef1;--mute:#8c929a;--acc:#f5b301;--red:#d64545}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:grid;grid-template:auto 1fr/300px 1fr 340px;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
  header{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;margin:0 12px 0 0}
  header input{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:6px 8px;border-radius:6px}
  button{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:7px 11px;border-radius:7px;cursor:pointer;font:inherit}
  button:hover{border-color:var(--mute)}
  button.on{background:var(--red);border-color:var(--red)}
  button.acc{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
  .spacer{flex:1}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--red)} #dot.on{background:#2ecc71}
  aside,section{overflow:auto;padding:12px;border-right:1px solid var(--line)}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin:4px 0 8px}
  .item{display:flex;align-items:center;gap:6px;padding:8px;border-radius:8px;margin-bottom:4px;background:var(--panel);cursor:pointer}
  .item.sel{outline:1px solid var(--mute)} .item.live{outline:2px solid var(--acc)}
  .item .t{flex:1} .item small{color:var(--mute)}
  .item .x{padding:2px 6px;font-size:12px}
  #slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .slide{background:var(--panel);border:2px solid transparent;border-radius:10px;padding:10px;cursor:pointer;min-height:110px;font-size:13px}
  .slide.live{border-color:var(--acc)}
  .slide .lb{color:var(--acc);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
  .slide .n{float:right;color:var(--mute);font-size:11px}
  textarea,input.f,select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:7px;font:13px/1.45 ui-monospace,Menlo,monospace}
  textarea{min-height:300px;resize:vertical}
  .row{display:flex;gap:6px;margin-bottom:6px} .row>*{flex:1}
  .hint{color:var(--mute);font-size:12px;margin:4px 0 10px}
  #results div{padding:6px 8px;border-radius:6px;cursor:pointer} #results div:hover{background:var(--card)}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:8px;display:none}
  .previews{display:flex;gap:8px;margin-bottom:12px}
  .previews iframe{width:50%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:6px;background:#000;pointer-events:none}
</style>
</head>
<body>
<header>
  <span id="dot"></span><h1>Bethlehem · Control</h1>
  <button id="bPrev" title="Săgeată stânga">◀</button><button id="bNext" class="acc" title="Spațiu / săgeată dreapta">Înainte ▶</button>
  <button id="bBlank" title="B">Negru (B)</button><button id="bLogo" title="L">Logo (L)</button>
  <select id="bg" style="width:180px"></select>
  <input id="msg" placeholder="Mesaj pe ecran (Enter)" style="width:220px">
  <span class="spacer"></span>
  <a href="/main.html" target="_blank"><button>Ecran principal</button></a>
  <a href="/stage.html" target="_blank"><button>Ecran scenă</button></a>
  <input id="pin" type="password" placeholder="PIN" style="width:80px"><button id="bLogin">OK</button><span id="role" class="hint"></span>
</header>

<aside>
  <h2>Program</h2>
  <div class="row"><input class="f" id="svcTitle" placeholder="Titlu serviciu"><input class="f" id="svcStart" type="datetime-local"></div>
  <div id="setlist"></div>
  <div class="row" style="margin-top:8px">
    <select id="addKind"><option value="sermon">Predică</option><option value="prayer">Rugăciune</option><option value="announcement">Anunțuri</option><option value="other">Altceva</option></select>
    <button id="bAddItem">+ Adaugă</button>
  </div>
  <p class="hint">Cântările se adaugă din dreapta. Doar liderul poate schimba ordinea.</p>
</aside>

<section>
  <div class="previews"><iframe src="/main.html" title="Ecran principal"></iframe><iframe src="/stage.html" title="Ecran scenă"></iframe></div>
  <h2 id="slidesTitle">Slide-uri</h2>
  <div class="row" id="arrRow" style="display:none">
    <input class="f" id="arrangement" placeholder="Aranjament: Strofa 1, Refren, Strofa 2, Refren">
    <select id="maxLines" style="max-width:110px"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select>
    <button id="bArr">Aplică</button>
  </div>
  <div id="slides"></div>
</section>

<aside style="border-right:0">
  <h2>Caută în bibliotecă</h2>
  <input class="f" id="q" placeholder="Titlu sau vers…">
  <div id="results"></div>

  <h2 style="margin-top:18px">Import din link</h2>
  <div class="row"><input class="f" id="importUrl" placeholder="https://www.resursecrestine.ro/…"><button id="bImport" style="flex:0">Ia</button></div>

  <h2 style="margin-top:18px">Cântare</h2>
  <input type="hidden" id="songId">
  <div class="row"><input class="f" id="songTitle" placeholder="Titlu"><input class="f" id="songKey" placeholder="Ton" style="max-width:60px"></div>
  <textarea id="songBody" placeholder="Strofa 1:
[G]Mare e [D]Domnul

Refren:
[C]Aleluia…

Poți lipi și acorduri deasupra versurilor — se convertesc automat."></textarea>
  <div class="row" style="margin-top:6px"><button id="bSave" class="acc">Salvează</button><button id="bSaveAdd">Salvează + adaugă în program</button><button id="bNew" style="flex:0">Nou</button></div>
  <p class="hint">Linie goală = slide nou. Etichete: Strofa, Refren, Punte, Intro, Final.</p>

  <h2 style="margin-top:18px">Fundaluri</h2>
  <input type="file" id="upload" accept="image/*,video/*">
</aside>
<div id="toast"></div>

<script type="module">
  import { connect, esc } from '/client.js';
  import { stripChords } from '/core/song.js';
  const KIND = { song: 'cântare', sermon: 'predică', prayer: 'rugăciune', announcement: 'anunțuri', other: 'altceva' };
  const $ = id => document.getElementById(id);
  let S = null, sel = -1;
  const hub = connect(s => { S = s; if (sel < 0 && s.live.item >= 0) sel = s.live.item; render(); }, e => {
    if (e.type === 'online' || e.type === 'offline') $('dot').classList.toggle('on', e.type === 'online');
    if (e.role) $('role').textContent = { viewer: 'doar vizualizare', operator: 'operator', leader: 'lider' }[e.role];
    if (e.type === 'error') toast(e.error);
    if (e.type === 'login') toast(e.ok ? 'Conectat ca ' + e.role : 'PIN greșit');
  });
  const send = o => hub.send(o);
  const api = (url, opt = {}) => fetch(url, { ...opt, headers: { 'x-pin': hub.pin(), ...(opt.headers || {}) } })
    .then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; });
  function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 2500); }

  // ---- live controls
  $('bNext').onclick = () => send({ type: 'next' });
  $('bPrev').onclick = () => send({ type: 'prev' });
  $('bBlank').onclick = () => send({ type: 'blank' });
  $('bLogo').onclick = () => send({ type: 'logo' });
  $('bg').onchange = e => send({ type: 'background', value: e.target.value });
  $('msg').onkeydown = e => { if (e.key === 'Enter') send({ type: 'message', value: e.target.value }); };
  $('bLogin').onclick = () => hub.login($('pin').value);
  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); send({ type: 'next' }); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') send({ type: 'prev' });
    if (e.key === 'b' || e.key === 'B' || e.key === '.') send({ type: 'blank' });
    if (e.key === 'l' || e.key === 'L') send({ type: 'logo' });
  });

  // ---- service + setlist (leader)
  $('svcTitle').onchange = e => send({ type: 'service', value: { title: e.target.value } });
  $('svcStart').onchange = e => send({ type: 'service', value: { startsAt: e.target.value ? new Date(e.target.value).toISOString() : null } });
  $('bAddItem').onclick = () => {
    const kind = $('addKind').value; const title = prompt('Titlu', $('addKind').selectedOptions[0].text); if (!title) return;
    send({ type: 'addItem', kind, title, minutes: Number(prompt('Minute', '5')) || 5 });
  };

  // ---- slides of the selected item
  async function render() {
    if (!S) return;
    if (document.activeElement !== $('svcTitle')) $('svcTitle').value = S.service.title || '';
    if (S.service.startsAt && document.activeElement !== $('svcStart')) {
      const d = new Date(S.service.startsAt); $('svcStart').value = new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    }
    $('bBlank').classList.toggle('on', S.live.blank); $('bLogo').classList.toggle('on', S.live.logo);
    $('setlist').innerHTML = S.setlist.map((it, i) => `<div class="item ${i === sel ? 'sel' : ''} ${i === S.live.item ? 'live' : ''}" data-i="${i}">
      <span class="t">${esc(it.title || it.kind)}<br><small>${esc([it.kind === 'song' ? (it.key ? 'ton ' + it.key : 'cântare') : KIND[it.kind], it.minutes + ' min', it.slideCount ? it.slideCount + ' slide-uri' : ''].filter(Boolean).join(' · '))}</small></span>
      <button class="x" data-a="up">↑</button><button class="x" data-a="down">↓</button><button class="x" data-a="key" title="Schimbă tonul">♯</button><button class="x" data-a="del">✕</button></div>`).join('')
      || '<p class="hint">Programul e gol. Caută o cântare în dreapta și apasă pe ea.</p>';
    document.querySelectorAll('#setlist .item').forEach(el => el.onclick = e => {
      const i = +el.dataset.i, a = e.target.dataset.a;
      if (a === 'up' || a === 'down') return send({ type: 'moveItem', item: i, dir: a === 'up' ? -1 : 1 });
      if (a === 'del') return confirmDel(i);
      if (a === 'key') { const k = prompt('Ton pentru acest serviciu (ex. A, Bb, F#m)', S.setlist[i].key || ''); if (k !== null) send({ type: 'updateItem', item: i, patch: { key: k.trim() } }); return; }
      sel = i; render(); loadSongInEditor(S.setlist[i]);
    });
    await renderSlides();
    const media = await fetch('/api/media').then(r => r.json()).catch(() => []);
    const cur = S.live.background;
    $('bg').innerHTML = '<option value="">Fără fundal</option>' + media.filter(m => m !== 'logo.png').map(m => `<option ${m === cur ? 'selected' : ''}>${esc(m)}</option>`).join('');
  }
  function confirmDel(i) { if (confirm('Scoți din program: ' + (S.setlist[i].title || S.setlist[i].kind) + '?')) send({ type: 'removeItem', item: i }); }

  async function renderSlides() {
    const it = S.setlist[sel];
    $('arrRow').style.display = it && it.kind === 'song' ? 'flex' : 'none';
    $('slidesTitle').textContent = it ? it.title : 'Slide-uri';
    if (!it) { $('slides').innerHTML = ''; return; }
    if (document.activeElement !== $('arrangement')) $('arrangement').value = (it.arrangement || []).join(', ');
    $('maxLines').value = String(it.maxLines || 4);
    let slides = sel === S.live.item ? S.live.slides : null;
    if (!slides) slides = await previewSlides(it);
    if (!slides.length) {
      $('slides').innerHTML = `<div class="slide ${sel === S.live.item ? 'live' : ''}" data-s="0"><div class="lb">${esc(KIND[it.kind])}</div>${esc(it.title)}</div>`;
    } else {
      $('slides').innerHTML = slides.map((sl, i) => `<div class="slide ${sel === S.live.item && i === S.live.slide ? 'live' : ''}" data-s="${i}">
        <span class="n">${i + 1}</span><div class="lb">${esc(sl.label)}</div>${sl.lines.map(l => esc(stripChords(l))).join('<br>')}</div>`).join('');
    }
    document.querySelectorAll('#slides .slide').forEach(el => el.onclick = () => send({ type: 'go', item: sel, slide: +el.dataset.s }));
  }
  // Slides for a non-live item are computed in the browser with the same engine.
  const songCache = new Map();
  async function previewSlides(it) {
    if (it.kind !== 'song') return [];
    const core = await import('/core/song.js');
    let song = songCache.get(it.songId);
    if (!song) { song = await fetch('/api/songs/' + it.songId).then(r => r.json()); songCache.set(it.songId, song); }
    const steps = it.key && song.key ? core.keyDistance(song.key, it.key) : 0;
    return core.toSlides(core.arrange(core.parseSong(core.transpose(song.body, steps)), it.arrangement || song.arrangement), it.maxLines || 4);
  }
  $('bArr').onclick = () => {
    const value = $('arrangement').value.split(',').map(s => s.trim()).filter(Boolean);
    send({ type: 'arrangement', item: sel, value: value.length ? value : null, maxLines: +$('maxLines').value });
  };

  // ---- library search
  let qTimer;
  $('q').oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(search, 150); };
  async function search() {
    const list = await fetch('/api/songs?q=' + encodeURIComponent($('q').value)).then(r => r.json());
    $('results').innerHTML = list.map(s => `<div data-id="${s.id}">${esc(s.title)} <small class="hint">${esc(s.key || '')}</small></div>`).join('') || '<p class="hint">Nimic găsit. Importă din link sau scrie-o mai jos.</p>';
    document.querySelectorAll('#results div').forEach(el => el.onclick = async () => {
      const song = await fetch('/api/songs/' + el.dataset.id).then(r => r.json());
      fillEditor(song);
      if (confirm('Adaugi „' + song.title + '” în program?')) send({ type: 'addItem', kind: 'song', songId: song.id, key: song.key, minutes: 5 });
    });
  }
  search();

  // ---- editor
  function fillEditor(s) { $('songId').value = s.id || ''; $('songTitle').value = s.title || ''; $('songKey').value = s.key || ''; $('songBody').value = s.body || ''; $('songBody').dataset.source = s.source || ''; }
  async function loadSongInEditor(it) { if (it.kind === 'song') { songCache.delete(it.songId); fillEditor(await fetch('/api/songs/' + it.songId).then(r => r.json())); } }
  function saveSong(addAfter) {
    const song = { id: $('songId').value || undefined, title: $('songTitle').value, key: $('songKey').value, body: $('songBody').value, source: $('songBody').dataset.source };
    if (!song.title.trim() || !song.body.trim()) return toast('Pune titlu și versuri');
    send({ type: 'saveSong', song });
    if (song.id) songCache.delete(song.id);
    toast('Salvat');
    setTimeout(async () => {
      await search();
      if (addAfter) {
        const list = await fetch('/api/songs?q=' + encodeURIComponent(song.title)).then(r => r.json());
        const found = list.find(x => x.title === song.title.trim());
        if (found) send({ type: 'addItem', kind: 'song', songId: found.id, key: found.key, minutes: 5 });
      }
    }, 400);
  }
  $('bSave').onclick = () => saveSong(false);
  $('bSaveAdd').onclick = () => saveSong(true);
  $('bNew').onclick = () => fillEditor({});

  // ---- import from link
  $('bImport').onclick = async () => {
    const url = $('importUrl').value.trim(); if (!url) return;
    $('bImport').disabled = true; toast('Se descarcă…');
    try {
      const r = await api('/api/import-url', { method: 'POST', body: JSON.stringify({ url }) });
      if (!r.body) throw new Error('Nu am găsit versurile pe pagină. Copiază-le manual.');
      fillEditor({ title: r.title, body: r.body, source: r.source });
      toast('Verifică versurile, apoi Salvează');
    } catch (e) { toast(e.message); }
    $('bImport').disabled = false;
  };

  // ---- background upload
  $('upload').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    toast('Se încarcă ' + f.name + '…');
    try { await api('/api/media?name=' + encodeURIComponent(f.name), { method: 'POST', body: f }); toast('Încărcat'); render(); }
    catch (err) { toast(err.message); }
  };
</script>
</body>
</html>
