<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/fonts/inter.css">
<link rel="stylesheet" href="/fonts/display/display.css">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Betleem – Sală</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;cursor:none;font-family:"Helvetica Neue",Arial,sans-serif}
  #bg,#bg>*{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  #shade{position:fixed;inset:0;background:rgba(0,0,0,.35)}
  #text{position:fixed;inset:6vh 6vw;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
        font-weight:700;font-size:6.2vh;line-height:1.3;text-shadow:0 .3vh 1.2vh rgba(0,0,0,.8);transition:opacity .25s}
  #text.hide{opacity:0}
  /* Bible: the verse, its reference, and a second language under it */
  #text .v2{font-size:.74em;font-weight:500;opacity:.88;margin-top:.9em;padding-top:.7em;border-top:1px solid rgba(255,255,255,.35)}
  #text .ref{font-size:.42em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-top:.5em}
  #pic{position:fixed;inset:0;background:#000;display:none}
  #pic img,#pic video{width:100%;height:100%;object-fit:contain;display:block}
  #logo{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000}
  #logo img{max-width:40vw;max-height:40vh}
  #msg{position:fixed;left:0;right:0;bottom:0;padding:1.5vh 3vw;background:rgba(0,0,0,.7);font-size:3.5vh;display:none}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>
<div id="text"></div>
<div id="pic"></div>
<div id="logo"><img src="/media/logo.png" alt="" onerror="this.remove()"></div>
<div id="msg"></div>
<script type="module">
  import { connect, esc, paintBackground, stayAwake } from '/client.js';
  import { stripChords } from '/core/song.js';
  const $ = id => document.getElementById(id);
  stayAwake();
  document.ondblclick = () => document.documentElement.requestFullscreen?.();
  // look of the text: general settings, a song may override them
  const V = { top: 'flex-start', middle: 'center', bottom: 'flex-end' }, H = { left: 'flex-start', center: 'center', right: 'flex-end' };
  function style(d) {
    const t = $('text').style;
    t.fontFamily = `"${d.font}", "Segoe UI", Arial, sans-serif`;
    t.fontSize = d.size + 'vh'; baseSize = d.size; t.color = d.color; t.fontWeight = d.weight;
    t.textAlign = d.align; t.alignItems = H[d.align]; t.justifyContent = V[d.valign];
    t.textTransform = d.upper ? 'uppercase' : 'none';
    t.textShadow = d.shadow ? '0 .3vh 1.2vh rgba(0,0,0,.85)' : 'none';
    t.lineHeight = d.lineHeight || 1.3; t.fontStyle = d.italic ? 'italic' : 'normal';
    const b = d.box;                                 // text area chosen in the slide editor
    if (b) Object.assign(t, { inset: 'auto', left: b.x + 'vw', top: b.y + 'vh', width: b.w + 'vw', height: b.h + 'vh' });
    else Object.assign(t, { inset: '6vh 6vw', left: '', top: '', width: '', height: '' });
    $('shade').style.background = `rgba(0,0,0,${(d.dim ?? 35) / 100})`;
  }
  // a long verse (or two languages) gets smaller letters instead of running off the screen
  let baseSize = 6.2;
  function fit() {
    const t = $('text'); t.style.fontSize = baseSize + 'vh';
    for (let v = baseSize; v > 2 && t.scrollHeight > t.clientHeight + 2; v -= 0.2) t.style.fontSize = v.toFixed(1) + 'vh';
  }
  connect(s => {
    const L = s.live, item = s.setlist[L.item];
    if (s.display) style({ ...s.display.main, ...(item?.display || {}), ...(item?.slideStyles?.[L.slide] || {}) });
    paintBackground($('bg'), L.background);
    const slide = L.slides[L.slide];
    // a page of a presentation, a picture or a video: whole screen, nothing on top
    const src = !L.blank && slide?.image || '';
    if ($('pic').dataset.src !== src) {
      $('pic').dataset.src = src;
      $('pic').innerHTML = !src ? '' : /\.(mp4|webm|mov)$/i.test(src) ? `<video src="${esc(src)}" autoplay playsinline></video>` : `<img src="${esc(src)}" alt="">`;
    }
    $('pic').style.display = src ? 'block' : 'none';
    const lines = sl => sl.lines.map(l => esc(stripChords(l))).filter(Boolean).join('<br>');
    const html = !slide ? '' : slide.bible
      ? `<div class="v1">${lines(slide)}<div class="ref">${esc(slide.label)} · ${esc(slide.bible)}</div></div>`
        + (slide.second ? `<div class="v2">${lines(slide.second)}<div class="ref">${esc(slide.second.label)} · ${esc(slide.second.bible)}</div></div>` : '')
      : lines(slide);
    $('text').classList.toggle('hide', L.blank || !html);
    if (!L.blank) { $('text').innerHTML = html; fit(); }
    $('logo').style.display = L.logo ? 'flex' : 'none';
    $('msg').style.display = L.message ? 'block' : 'none';
    $('msg').textContent = L.message;
  });
</script>
</body>
</html>
