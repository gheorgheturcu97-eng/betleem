<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/fonts/inter.css">
<link rel="stylesheet" href="/fonts/display/display.css">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reverb – Sală</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;cursor:none;font-family:"Helvetica Neue",Arial,sans-serif}
  #bg,#bg>*{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  #shade{position:fixed;inset:0;background:rgba(0,0,0,.35)}
  .txt{position:fixed;inset:6vh 6vw;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
        font-weight:700;font-size:6.2vh;line-height:1.3;text-shadow:0 .3vh 1.2vh rgba(0,0,0,.8);transition:opacity .25s}
  .txt.hide{opacity:0}
  .txt.ghost{pointer-events:none;z-index:1}          /* the old words while they leave (fade / crossfade / dissolve) */
  /* Bible: the verse, its reference, and a second language under it */
  .txt .v2{font-size:.74em;font-weight:500;opacity:.88;margin-top:.9em;padding-top:.7em;border-top:1px solid rgba(255,255,255,.35)}
  .txt .ref{font-size:.42em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-top:.5em}
  #pic{position:fixed;inset:0;background:#000;display:none}
  #pic{overflow:hidden}
  #pic img,#pic video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#000}
  #logo{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000}
  #logo img{max-width:40vw;max-height:40vh}
  #lyUnder,#lyOver,#props{position:fixed;inset:0}   /* 🧱 layers of the slide (under / over the words) and 🏷 Props over everything */
  #props{z-index:2}
  #msg{position:fixed;left:0;right:0;bottom:0;padding:1.5vh 3vw;background:rgba(0,0,0,.7);font-size:3.5vh;display:none;z-index:5}
  #black{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:4}
  #black.on{opacity:1}
  /* countdown before the service */
  #count{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;z-index:3;
         text-shadow:0 .4vh 2vh rgba(0,0,0,.7);font-family:Inter,"Helvetica Neue",Arial,sans-serif}
  #count small{font-size:4vh;font-weight:500;letter-spacing:.02em;opacity:.9}
  #count b{font-size:20vh;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>
<div id="lyUnder" class="ly-box"></div>
<div id="text" class="txt"></div>
<div id="pic"></div>
<div id="lyOver" class="ly-box"></div>
<div id="props" class="ly-box"></div>
<div id="logo"></div>
<div id="count"><small id="countLabel"></small><b id="countTime"></b></div>
<div id="black"></div>
<div id="msg"></div>
<script type="module">
  import { connect, esc, paintBackground, stayAwake } from '/client.js';
  import { stripChords } from '/core/song.js';
  import { renderLayers } from '/layers.js';
  const $ = id => document.getElementById(id);
  stayAwake();
  document.ondblclick = () => document.documentElement.requestFullscreen?.();
  // look of the text: general settings, a song may override them
  const V = { top: 'flex-start', middle: 'center', bottom: 'flex-end' }, H = { left: 'flex-start', center: 'center', right: 'flex-end' };
  function style(d) {
    const t = $('text').style;
    t.fontFamily = `"${d.font}", "Segoe UI", Arial, sans-serif`;
    t.fontSize = d.size + 'vh'; baseSize = d.size; t.color = d.color; t.fontWeight = d.weight;
    t.textAlign = d.align; t.alignItems = H[d.align]; t.justifyContent = V[d.valign];
    t.textTransform = d.upper ? 'uppercase' : 'none';
    t.textShadow = d.shadow ? '0 .3vh 1.2vh rgba(0,0,0,.85)' : 'none';
    t.lineHeight = d.lineHeight || 1.3; t.fontStyle = d.italic ? 'italic' : 'normal';
    const b = d.box;                                 // text area chosen in the slide editor
    if (b) Object.assign(t, { inset: 'auto', left: b.x + 'vw', top: b.y + 'vh', width: b.w + 'vw', height: b.h + 'vh' });
    else Object.assign(t, { inset: '6vh 6vw', left: '', top: '', width: '', height: '' });
    $('shade').style.background = `rgba(0,0,0,${(d.dim ?? 35) / 100})`;
  }
  // a long verse (or two languages) gets smaller letters instead of running off the screen
  let baseSize = 6.2;
  function fit() {
    const t = $('text'); t.style.fontSize = baseSize + 'vh';
    for (let v = baseSize; v > 2 && t.scrollHeight > t.clientHeight + 2; v -= 0.2) t.style.fontSize = v.toFixed(1) + 'vh';
  }
  // countdown: "Începem în 4:59", hides itself at zero
  let S = null, skew = 0;
  function tick() {
    const c = S?.live.countdown, show = c && c.screens !== 'stage' && !S.live.blank;
    const left = show ? Math.ceil((c.to - Date.now() - skew) / 1000) : 0;
    $('count').style.display = show && left > 0 ? 'flex' : 'none';
    if (show && left > 0) {
      $('countLabel').textContent = c.label;
      const h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), sec = left % 60;
      $('countTime').textContent = (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
    }
    $('text').style.visibility = $('pic').style.visibility = show && left > 0 ? 'hidden' : '';   // the countdown stands alone on the background
    bgNow(show && left > 0 && c.bg ? c.bg : S?.live.background);                                // …on its own background, if one was chosen
  }
  function bgNow(name) { name = name || ''; if ($('bg').dataset.now === name) return; $('bg').dataset.now = name; paintBackground($('bg'), name); }
  setInterval(tick, 250);
  // the video on screen follows Play / Pauză / De la început / Sunet from the control window
  let vidAt = 0;
  function video(L) {
    const v = $('pic').querySelector('video'); if (!v) return;
    v.muted = !!L.video?.muted;
    if (L.video && L.video.at !== vidAt) {
      vidAt = L.video.at;
      if (L.video.cmd === 'pause') v.pause();
      else { if (L.video.cmd === 'restart') v.currentTime = 0; v.play().catch(() => { v.muted = true; v.play().catch(() => {}); }); }
    }
  }
  // PowerPoint's transitions between pages: fade, push, wipe, cover, uncover, split, zoom
  const MOVE = { l: [-1, 0], r: [1, 0], u: [0, -1], d: [0, 1] };
  function showPic(src, tr, muted) {
    const pic = $('pic'), old = [...pic.children];
    if (!src) { pic.replaceChildren(); return; }
    const el = /\.(mp4|webm|mov)$/i.test(src) ? Object.assign(document.createElement('video'), { src, autoplay: true, playsInline: true, muted: !!muted })
      : Object.assign(document.createElement('img'), { src, alt: '' });
    const go = () => {
      if (!old.length || !tr || tr.type === 'cut' || !tr.dur || pic.style.display === 'none') { pic.replaceChildren(el); return; }
      const dur = tr.dur, ease = 'cubic-bezier(.4,0,.2,1)', [x, y] = MOVE[tr.dir] || MOVE.l, done = () => old.forEach(o => o.remove());
      const from = `translate(${-x * 100}%, ${-y * 100}%)`, to = `translate(${x * 100}%, ${y * 100}%)`;
      if (tr.type === 'uncover') { pic.prepend(el); old.at(-1).animate([{ transform: 'none' }, { transform: to }], { duration: dur, easing: ease }).finished.then(done); return; }
      pic.append(el);
      const k = { fade: [{ opacity: 0 }, { opacity: 1 }], cover: [{ transform: from }, { transform: 'none' }], push: [{ transform: from }, { transform: 'none' }],
        zoom: [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }],
        wipe: [{ clipPath: x < 0 ? 'inset(0 0 0 100%)' : x > 0 ? 'inset(0 100% 0 0)' : y < 0 ? 'inset(100% 0 0 0)' : 'inset(0 0 100% 0)' }, { clipPath: 'inset(0)' }],
        split: tr.dir === 'in' ? [{ clipPath: 'inset(0 50%)' }, { clipPath: 'inset(0)' }] : [{ clipPath: 'inset(0 50% 0 50%)' }, { clipPath: 'inset(0)' }] }[tr.type] || [{ opacity: 0 }, { opacity: 1 }];
      if (tr.type === 'push') old.at(-1).animate([{ transform: 'none' }, { transform: to }], { duration: dur, easing: ease, fill: 'forwards' });
      el.animate(k, { duration: dur, easing: ease }).finished.then(done, done);
    };
    if (el.tagName === 'IMG' && !el.complete) { el.onload = go; el.onerror = go; } else go();   // never show half a picture
  }
  // how the words change: cut (as before), fade (out, then in), crossfade (both at once), dissolve (soft blur)
  const TR_DEF = 500;
  let lastHtml = null;
  function swapText(html, d) {
    const t = $('text'), type = d.tr || 'cut', dur = Math.max(0, Math.min(3000, Number.isFinite(+d.trDur) ? +d.trDur : TR_DEF));
    document.querySelectorAll('.txt.ghost').forEach(g => g.remove()); t.getAnimations().forEach(a => a.cancel());
    const had = lastHtml; lastHtml = html;
    if (type === 'cut' || !dur || !had || t.classList.contains('hide')) { t.innerHTML = html; fit(); return; }
    const g = t.cloneNode(true); g.removeAttribute('id'); g.classList.add('ghost'); g.style.transition = 'none';
    t.after(g); t.innerHTML = html; fit();
    const ease = 'cubic-bezier(.4,0,.2,1)', blur = type === 'dissolve';
    const out = [{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: blur ? 'blur(1.2vh)' : 'blur(0)' }];
    const inn = [{ opacity: 0, filter: blur ? 'blur(1.2vh)' : 'blur(0)' }, { opacity: 1, filter: 'blur(0)' }];
    const half = type === 'fade' ? dur / 2 : dur;
    g.animate(out, { duration: half, easing: ease, fill: 'forwards' }).finished.then(() => g.remove(), () => g.remove());
    t.animate(inn, { duration: half, delay: type === 'fade' ? half : 0, easing: ease, fill: 'backwards' });
  }
  const picTr = d => !d.tr || d.tr === 'cut' ? null : { type: 'fade', dur: Number.isFinite(+d.trDur) ? +d.trDur : TR_DEF };
  connect(s => {
    S = s; if (s.now) skew = s.now - Date.now();
    const L = s.live, item = s.setlist[L.item];
    const dd = s.display ? { ...s.display.main, ...(item?.display || {}), ...(item?.slideStyles?.[L.slide] || {}) } : {};
    if (s.display) style(dd);
    tick();
    const slide = L.slides[L.slide];
    // a page of a presentation, a picture or a video: whole screen, nothing on top
    const src = !L.blank && slide?.image || '';
    if ($('pic').dataset.src !== src) {
      $('pic').dataset.src = src;
      showPic(src, slide?.transition || picTr(dd), s.live.video?.muted);
    }
    $('pic').style.display = src ? 'block' : 'none';
    const lines = sl => sl.lines.map(l => esc(stripChords(l))).filter(Boolean).join('<br>');
    const html = !slide ? '' : slide.bible
      ? `<div class="v1">${lines(slide)}<div class="ref">${esc(slide.label)} · ${esc(slide.bible)}</div></div>`
        + (slide.second ? `<div class="v2">${lines(slide.second)}<div class="ref">${esc(slide.second.label)} · ${esc(slide.second.bible)}</div></div>` : '')
      : lines(slide);
    video(L);
    $('text').classList.toggle('hide', L.blank || L.noText || !html);
    if (!L.blank && !L.noText) { if (html !== lastHtml) swapText(html, dd); else fit(); }
    $('black').classList.toggle('on', !!L.blank);
    // 🧱 the slide's own layers (a slide's, else the whole song's) and 🏷 the Props that are switched on
    const lys = L.blank || L.item < 0 ? [] : item?.slideLayers?.[L.slide] ?? item?.layers ?? [];
    renderLayers($('lyUnder'), lys.filter(l => l.under), { animate: true });
    renderLayers($('lyOver'), lys.filter(l => !l.under), { animate: true });
    renderLayers($('props'), (s.props || []).filter(p => p.on).flatMap(p => p.layers.map(l => ({ ...l, id: p.id + '-' + l.id }))), { animate: true });
    $('logo').style.display = L.logo ? 'flex' : 'none';
    if (L.logo) {                                    // logo.png from Fundaluri, otherwise the church's own logo
      const img = $('logo').querySelector('img') || $('logo').appendChild(Object.assign(document.createElement('img'), { alt: '' }));
      const want = s.church?.logo ? '/media/' + encodeURIComponent(s.church.logo) : '/media/logo.png';
      if (img.dataset.w !== want) { img.dataset.w = want; img.onerror = () => { if (img.src.endsWith('/media/logo.png')) img.remove(); };
        fetch('/media/logo.png', { method: 'HEAD' }).then(r => { img.src = r.ok ? '/media/logo.png' : want; }).catch(() => { img.src = want; }); }
    }
    $('msg').style.display = L.message && L.messageTo !== 'stage' ? 'block' : 'none';
    $('msg').textContent = L.message;
  });
</script>
</body>
</html>
