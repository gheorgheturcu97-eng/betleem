<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Betleem">
<meta name="theme-color" content="#121316">
<link rel="stylesheet" href="/fonts/inter.css">
<title>Slujirea mea</title>
<style>
  /* 🙋 a volunteer's own page: opened from the personal link the leader sends on WhatsApp. No password, no app to install. */
  :root{--bg:#121316;--card:#1d1f24;--line:#2b2e35;--fg:#f2f3f5;--mute:#9aa0aa;--acc:#f5b301;--ok:#2ecc71;--no:#ff5a5a}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 Inter,-apple-system,system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
  h1{font-size:26px;margin:4px 0 0} .sub{color:var(--mute);margin-bottom:18px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:24px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
  .when{font-weight:700;font-size:17px} .what{color:var(--mute);font-size:14px;margin-top:2px} .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .btns{display:flex;gap:8px;margin-top:12px} .btns button{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:#26292f;color:var(--fg);font:600 15px system-ui}
  .btns .yes.on{background:var(--ok);border-color:var(--ok);color:#06210f} .btns .nope.on{background:var(--no);border-color:var(--no);color:#2a0505}
  .st{float:right;font-size:12px;padding:3px 9px;border-radius:999px;background:#2a2d33;color:var(--mute)} .st.confirmed{background:rgba(46,204,113,.18);color:var(--ok)} .st.declined{background:rgba(255,90,90,.15);color:var(--no)}
  .task{display:flex;gap:12px;align-items:flex-start} .task input{width:24px;height:24px;margin-top:2px;accent-color:var(--ok)} .task .t{flex:1} .task.done .t{text-decoration:line-through;color:var(--mute)}
  .due{font-size:13px;color:var(--mute)} .due.late{color:var(--no);font-weight:600}
  .cal{background:none;border:0;color:var(--acc);font:600 13px system-ui;padding:4px 0;cursor:pointer}
  .days{display:flex;flex-wrap:wrap;gap:8px} .days button{border:1px solid var(--line);background:#23262c;color:var(--fg);border-radius:12px;padding:9px 12px;font:600 14px system-ui}
  .days button.off{background:rgba(255,90,90,.16);border-color:var(--no);color:#ffb3b3;text-decoration:line-through}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px} select,input[type=date]{background:#23262c;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:15px system-ui}
  .agenda li{margin:4px 0} .agenda .d{color:var(--mute);text-decoration:line-through}
  .empty{color:var(--mute);font-size:15px} .err{padding:30px 0;text-align:center;color:var(--mute)}
  .tip{margin-top:26px;color:var(--mute);font-size:13px;text-align:center}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#2b2e35;padding:10px 16px;border-radius:12px;transition:.25s;opacity:0}
  #toast.show{transform:translateX(-50%);opacity:1}
</style>
</head>
<body>
<main id="app"><p class="err">Se încarcă…</p></main>
<div id="toast"></div>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  // the personal link is remembered, so the icon on the home screen keeps working
  let t = new URLSearchParams(location.search).get('t');
  try { if (t) localStorage.setItem('bnc-eu', t); else t = localStorage.getItem('bnc-eu'); } catch {}
  let D = null;
  const toast = m => { $('toast').textContent = m; $('toast').classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').classList.remove('show'), 2200); };
  const day = iso => new Date(iso).toLocaleDateString('ro-RO', { weekday: 'long', day: 'numeric', month: 'long' });
  const hm = iso => new Date(iso).toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
  const today = () => new Date().toISOString().slice(0, 10);

  async function load(post) {
    if (!t) { $('app').innerHTML = '<p class="err">Deschide linkul personal primit de la liderul tău.</p>'; return; }
    try {
      const r = await fetch('/api/eu?t=' + encodeURIComponent(t), post ? { method: 'POST', body: JSON.stringify(post) } : {});
      const j = await r.json(); if (!r.ok) throw new Error(j.error); D = j; render();
    } catch (e) { $('app').innerHTML = `<p class="err">${esc(e.message || 'Nu mă pot conecta. Ești pe Wi-Fi-ul bisericii?')}</p>`; }
  }

  // 📅 a calendar file: Apple, Google and Outlook all open it
  function ics(title, start, mins, allDay) {
    const z = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const s = new Date(start), e = new Date(s.getTime() + (mins || 60) * 60000);
    const when = allDay ? `DTSTART;VALUE=DATE:${start.replace(/-/g, '')}` : `DTSTART:${z(s)}\r\nDTEND:${z(e)}`;
    const txt = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Betleem//RO', 'BEGIN:VEVENT', 'UID:' + Math.random().toString(36).slice(2) + '@betleem', 'DTSTAMP:' + z(new Date()), when,
      'SUMMARY:' + title.replace(/[,;\n]/g, ' '), 'BEGIN:VALARM', 'TRIGGER:' + (allDay ? '-PT15H' : '-PT2H'), 'ACTION:DISPLAY', 'DESCRIPTION:' + title.replace(/[,;\n]/g, ' '), 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/calendar' })); a.download = 'betleem.ics'; a.click();
  }

  function render() {
    const serve = D.serve.map((x, i) => `<div class="card"><span class="st ${x.status}">${{ pending: 'aștept răspuns', confirmed: '✓ vin', declined: '✕ nu pot' }[x.status] || ''}</span>
      <div class="when">${esc(day(x.date))} · ${hm(x.date)}</div>
      <div class="what"><span class="dot" style="background:${esc(x.color || '#888')}"></span>${esc(x.dept)} · <b>${esc(x.pos)}</b> · ${esc(x.title)}</div>
      <div class="btns"><button class="yes ${x.status === 'confirmed' ? 'on' : ''}" data-a="${i}" data-s="confirmed">✓ Vin</button><button class="nope ${x.status === 'declined' ? 'on' : ''}" data-a="${i}" data-s="declined">✕ Nu pot</button></div>
      <button class="cal" data-c="${i}">📅 Pune în calendar</button></div>`).join('') || '<p class="empty">Nu ești programat în perioada următoare.</p>';
    const tasks = D.tasks.length ? `<h2>Sarcinile mele</h2>` + D.tasks.map((k, i) => `<div class="card task ${k.done ? 'done' : ''}"><input type="checkbox" data-k="${i}" ${k.done ? 'checked' : ''}>
      <div class="t">${esc(k.text)}${k.due ? `<div class="due ${!k.done && k.due < today() ? 'late' : ''}">până ${esc(new Date(k.due + 'T12:00').toLocaleDateString('ro-RO', { weekday: 'short', day: 'numeric', month: 'short' }))}${!k.done && k.due < today() ? ' · a trecut termenul' : ''}</div><button class="cal" data-kc="${i}">📅 Amintește-mi</button>` : ''}</div></div>`).join('') : '';
    const meets = D.meetings.map((m, i) => `<div class="card"><div class="when">${esc(m.title)}</div><div class="what">${esc(day(m.date))} · ${hm(m.date)}</div>
      ${m.agenda.length ? `<ol class="agenda">${m.agenda.map(a => `<li class="${a.done ? 'd' : ''}">${esc(a.text)}</li>`).join('')}</ol>` : '<p class="empty">Agenda nu e scrisă încă.</p>'}
      ${m.tasks.length ? `<div class="what" style="margin-top:8px"><b>Sarcini:</b><br>${m.tasks.map(k => `${k.done ? '☑' : '☐'} ${esc(k.text)} <span class="due">· ${esc(k.who || 'nimeni')}${k.due ? ' · ' + esc(k.due.slice(8) + '.' + k.due.slice(5, 7)) : ''}</span>`).join('<br>')}</div>` : ''}
      <button class="cal" data-mc="${i}">📅 Pune în calendar</button></div>`).join('');
    // the next Sundays to block quickly, plus any other day already blocked
    const sundays = []; const d = new Date(); d.setDate(d.getDate() + ((7 - d.getDay()) % 7)); for (let i = 0; i < 12; i++) { sundays.push(d.toISOString().slice(0, 10)); d.setDate(d.getDate() + 7); }
    const daysAll = [...new Set([...sundays, ...D.away.filter(x => x >= today())])].sort();
    $('app').innerHTML = `<h1>Salut, ${esc(D.name.split(' ')[0])}!</h1><div class="sub">${esc(D.church)} · slujirea ta</div>
      <h2>Când slujești</h2>${serve}${tasks}${meets ? '<h2>Întâlnirea liderilor</h2>' + meets : ''}
      <h2>Când nu pot</h2><div class="card"><div class="what" style="margin-bottom:10px">Apasă pe duminicile când lipsești. Liderul nu te va putea pune în acele zile.</div>
        <div class="days">${daysAll.map(x => `<button class="${D.away.includes(x) ? 'off' : ''}" data-d="${x}">${esc(new Date(x + 'T12:00').toLocaleDateString('ro-RO', { day: 'numeric', month: 'short', ...(new Date(x + 'T12:00').getDay() ? { weekday: 'short' } : {}) }))}</button>`).join('')}</div>
        <div class="row"><span class="what">Altă zi:</span><input type="date" id="other" min="${today()}"></div>
        <div class="row"><span class="what">Pot sluji cel mult</span><select id="max">${[0, 1, 2, 3, 4].map(n => `<option value="${n}" ${n === D.maxPerMonth ? 'selected' : ''}>${n ? n + (n === 1 ? ' dată' : ' ori') + ' pe lună' : 'oricât e nevoie'}</option>`).join('')}</select></div></div>
      <p class="tip">Sfat: pune pagina pe ecranul principal (Distribuie → Adaugă pe ecranul principal) și o ai ca pe o aplicație.</p>`;
    document.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => { const x = D.serve[+b.dataset.a]; await load({ action: 'answer', service: x.service, key: x.key, status: b.dataset.s }); toast(b.dataset.s === 'confirmed' ? 'Mulțumim! Te așteptăm.' : 'Am anunțat liderul.'); });
    document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { const x = D.serve[+b.dataset.c]; ics(`${x.pos} · ${x.title}`, x.date, 120); });
    document.querySelectorAll('[data-kc]').forEach(b => b.onclick = () => { const k = D.tasks[+b.dataset.kc]; ics('Betleem: ' + k.text, k.due, 0, true); });
    document.querySelectorAll('[data-mc]').forEach(b => b.onclick = () => { const m = D.meetings[+b.dataset.mc]; ics(m.title, m.date, 90); });
    document.querySelectorAll('[data-k]').forEach(c => c.onchange = () => load({ action: 'task', task: D.tasks[+c.dataset.k].id, done: c.checked }));
    const saveAway = away => load({ action: 'away', away, maxPerMonth: +$('max').value });
    document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const x = b.dataset.d; saveAway(D.away.includes(x) ? D.away.filter(y => y !== x) : [...D.away, x]); });
    $('other').onchange = () => { if ($('other').value) saveAway([...D.away, $('other').value]); };
    $('max').onchange = () => { saveAway(D.away); toast('Salvat'); };
  }
  load();
</script>
</body>
</html>
